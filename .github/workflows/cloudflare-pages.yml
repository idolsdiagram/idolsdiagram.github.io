name: Astro Build and Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 15 * * *" # Daily at 00:15 JST
    - cron: "15 3 * * *" # Daily at 12:15 JST
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET_INDEX: ${{ secrets.S3_BUCKET_INDEX }}
      S3_BUCKET_SPOTIFY: ${{ secrets.S3_BUCKET_SPOTIFY }}
      GOOGLE_FORMS_WEBHOOK_URL: ${{ secrets.GOOGLE_FORMS_WEBHOOK_URL }}
      GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
      GROUP_JSON_URL: ${{ secrets.GROUP_JSON_URL }}
      MEMBER_JSON_URL: ${{ secrets.MEMBER_JSON_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SPOTIFY_JSON_URL: ${{ secrets.SPOTIFY_JSON_URL }}
      OG_DESCRIPTION: ${{ vars.OG_DESCRIPTION }}
      OG_IMAGE_DOMAIN: ${{ vars.OG_IMAGE_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
